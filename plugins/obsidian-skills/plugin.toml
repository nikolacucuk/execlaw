[plugin]
id = "obsidian-skills"
name = "Obsidian Skills"
version = "0.4.0"

[runtime]
tier = "script"
source = "main.rhai"

[[skills]]
name = "vault-workflow"
entry = "skills/vault-workflow.md"
description = "Draft notes and updates that fit an Obsidian vault workflow."

[[skills]]
name = "atomic-notes"
entry = "skills/atomic-notes.md"
description = "Split ideas into small, linked notes with clear titles and tags."

[[skills]]
name = "web-clipper"
entry = "skills/web-clipper.md"
description = "Turn web-scraper captures into reviewable, source-preserving Obsidian notes."

[[skills]]
name = "second-brain"
entry = "skills/second-brain.md"
description = "Archive, process, and retrieve Obsidian knowledge with provenance, freshness, and approval boundaries."

[[skills]]
name = "archive-operations"
entry = "skills/archive-operations.md"
description = "Create reproducible archive records and post-processing logs linked to execlaw runs and memory assets."
