[package]
name = "execlaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "execlaw CLI: up, doctor, db migrate, hw rescan, vault rekey, plugin install."

[[bin]]
name = "execlaw"
path = "src/main.rs"

[dependencies]
execlaw-core = { path = "../core" }
execlaw-container-manager = { path = "../container-manager" }
execlaw-plugin-sdk = { path = "../plugin-sdk" }
execlaw-server = { path = "../server" }
execlaw-vault = { path = "../vault" }
execlaw-inference-api = { path = "../inference-api" }
execlaw-plugin-host = { path = "../plugin-host" }
execlaw-policy = { path = "../policy" }
execlaw-skills = { path = "../skills" }
rusqlite.workspace = true

clap.workspace = true
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
regex.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true
directories.workspace = true
keyring.workspace = true
axum.workspace = true
rand.workspace = true
hex.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
rpassword = "7.5"

# Phase 14 — bare-metal install. service-manager abstracts systemd
# (Linux) / launchd (macOS) / Windows SCM behind one trait so the
# `execlaw service install/start/stop/uninstall` commands carry one
# Rust impl instead of three platform-specific install scripts.
service-manager = "0.11"

# windows-service is the runtime side of the Windows story: when
# running as a Windows service, the binary needs to handle SCM
# control messages (start/stop/PowerEvent) — service-manager only
# handles registration with the SCM, not the runtime loop.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile.workspace = true

[features]
sqlcipher = ["execlaw-core/sqlcipher"]
