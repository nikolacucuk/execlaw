[package]
name = "execlaw-eval-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local rubric evaluation and reproducible real-task benchmark harness."

[[bin]]
name = "eval-harness"
path = "src/main.rs"

[dependencies]
execlaw-inference-api = { path = "../inference-api" }
execlaw-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
