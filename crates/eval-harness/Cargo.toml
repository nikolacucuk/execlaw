[package]
name = "execlaw-eval-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local rubric evaluation and reproducible real-task benchmark harness."

[[bin]]
name = "eval-harness"
path = "src/main.rs"

[dependencies]
execlaw-inference-api = { path = "../inference-api" }
execlaw-core = { path = "../core" }
execlaw-runner-local = { path = "../runner-local" }
execlaw-container-manager = { path = "../container-manager" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
clap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
rmp-serde.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
