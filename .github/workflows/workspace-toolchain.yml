name: workspace-toolchain

on:
  push:
    tags:
      - "workspace-toolchain-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version published to GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and attest isolated workspace toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image version
        id: image
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="${REF_NAME#workspace-toolchain-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use numeric semver (x.y.z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/execlaw-workspace-toolchain" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workspace-toolchain
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
